    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Underpaid",
      "description": "AI-driven salary analysis tool that helps you understand if you're being paid fairly based on your role, experience, location, and workload.",
      "url": "https://www.underpaidapp.com",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free salary analysis"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How does this tool work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You enter your job details, salary, and work conditions. Our AI analyzes this against market data to determine if you're being paid fairly for your role, experience, and location. The analysis considers factors like hours worked, stress levels, and job satisfaction to give you a complete picture."
          }
        },
        {
          "@type": "Question",
          "name": "Is my data stored or shared?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Your data is analyzed in real-time and is not stored on our servers. We do not share your information with employers, recruiters, or any third parties. Your privacy is our priority."
          }
        },
        {
          "@type": "Question",
          "name": "How accurate is the salary analysis?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Our analysis uses current market data and AI to provide estimates. While no tool can be 100% accurate due to the many variables in compensation, our results give you a reliable benchmark for understanding your market position and preparing for salary conversations."
          }
        },
        {
          "@type": "Question",
          "name": "What do I do if I'm underpaid?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The analysis provides actionable paths forward: negotiate with your current employer, optimize your workload, or explore new opportunities. For more detailed guidance, including manager-specific scripts and rejection response strategies, consider our premium options."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to create an account?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No account is required to run a basic analysis. However, creating an account allows you to save your results, access premium features like PDF exports and negotiation scripts, and track your compensation over time."
          }
        }
      ]
    }
    </script>
